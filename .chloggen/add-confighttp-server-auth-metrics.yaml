# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, e.g. receiver/prometheus, exporter/otlp, ...
component: config/confighttp

# A brief description of the change. Surround your text with quotes ("...") if it contains special characters.
short_description: Add server-side authentication metrics to confighttp

# One or more tracking issues related to the change
issues: [14412]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
# Use pipe (|) for multiline entries.
additional_details: |
  Adds instrumentation metrics for server-side authentication events in confighttp,
  including counters for successful and failed authentication attempts. This allows
  operators to monitor authentication health and detect potential security issues.
  
  New metrics:
  - `otelcol_confighttp_server_auth_success_total`: Number of successful authentication attempts
  - `otelcol_confighttp_server_auth_failure_total`: Number of failed authentication attempts
  
  Attributes:
  - `auth_type`: The type of authentication used (e.g., bearer, basic, oidc)
  - `failure_reason`: For failures, the reason for the authentication failure
